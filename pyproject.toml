[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-cheese-schemas"
version = "1.0.0"
description = "Shared document and manifest schemas for the easy-cheese agent workflow, with schema-version tolerance."
readme = "docs/easy-cheese-schemas.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Paul Sorensen", email = "paulnsorensen@gmail.com" }]
keywords = ["schema", "cattrs", "agents", "easy-cheese"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# Floors match the versions vendored under vendor/ and exercised by the suite.
# compat.py reaches cattrs.cols.list_structure_factory and the structural
# AttributeValidationNote / IterableValidationNote, so a lower floor would be an
# untested claim rather than a supported configuration.
dependencies = ["attrs>=26.1.0", "cattrs>=26.1.0"]

[project.urls]
Homepage = "https://github.com/paulnsorensen/easy-cheese"
Repository = "https://github.com/paulnsorensen/easy-cheese"
Issues = "https://github.com/paulnsorensen/easy-cheese/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_cheese_schemas"]
exclude = ["src/easy_cheese_schemas/_phase_registry_compiler.py"]

# Hatchling's default sdist walks the filesystem honouring .gitignore, which
# would ship the whole repo -- including untracked scratch and the vendored
# trees, whose PSF/MIT licences this distribution's metadata does not declare.
# A PyPI filename can never be reused, so an over-broad sdist is permanent.
# docs/easy-cheese-schemas.md must stay: it is the `readme`, and building the
# wheel from the sdist fails without it.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/easy_cheese_schemas",
  "docs/easy-cheese-schemas.md",
  "LICENSE",
]
