id: ts-console-log
snapshots:
  console.debug(state);:
    labels:
    - source: console.debug(state)
      style: primary
      start: 0
      end: 20
  "console.log(\"fetching user\", id);":
    labels:
    - source: console.log("fetching user", id)
      style: primary
      start: 0
      end: 32
