name: wedge

# `check` fails a pull request whose wedge lock is stale, whose launcher
# drifted from the template, or that commits a .pyz beside a launcher.
# `publish` builds each locked skill after a merge and uploads any missing
# content-addressed archive to the rolling `wedge` release. Both run the wedge
# commit that tools/wedge/uv.lock pins, the same one `just wedge-lock` runs
# locally, so there is one pin. Publication is
# append-only, so concurrent runs are safe; do not add cancellation that could
# drop a pending publication.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check wedge locks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Check wedge locks
        run: uv run --locked --project tools/wedge wedge check --root skills

  publish:
    name: publish wedge assets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify HEAD is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Refusing to publish wedge assets from an unreviewed commit."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Publish wedge assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          uv run --locked --project tools/wedge wedge publish \
            --root skills --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
