name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish github release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Refusing to publish a release from an unreviewed branch."
            exit 1
          fi

      - name: Install latest gh CLI
        run: |
          set -euo pipefail
          # The releases/latest redirect makes no API call, so the shared
          # runner rate limit cannot fail this step with HTTP 403.
          url=$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest)
          latest="${url##*/}"
          ver="${latest#v}"
          curl -fsSL --retry 3 "https://github.com/cli/cli/releases/download/${latest}/gh_${ver}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 755 "/tmp/gh_${ver}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Set up just
        run: |
          uv tool install rust-just==1.58.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Main tracks no archives, so the tagged commit builds its own.
      - name: Build archives
        run: just wedge-build

      # stage_release copies each skill's SKILL.md and executable self-contained
      # archive; it needs only the standard library.
      - name: Stage shippable release tree
        run: python3 scripts/stage_release.py --out "$RUNNER_TEMP/release"

      - name: Validate staged skills
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      # gh skill install reads the git tree at the resolved tag. Each skill carries
      # its executable archive and immutable metadata, so the release tree contains
      # no loose source, build configuration, or rolling archive dependency.
      - name: Publish release branch and retarget tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src_sha="$GITHUB_SHA"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP/release"
          git init -q
          git checkout -q -b release
          git add -A
          git -c user.email=actions@github.com -c user.name="github-actions[bot]" \
            commit -qm "release: $TAG from main@${src_sha}"
          git push -f "$remote" "release:refs/heads/release"
          git tag -f "$TAG"
          git push -f "$remote" "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          gh repo edit "$GITHUB_REPOSITORY" --add-topic agent-skills || true
          # `gh --generate-notes` is useless once the tag is retargeted onto the
          # orphan release snapshot (no main history to diff). Build notes from
          # main directly, anchored on GITHUB_SHA — the commit the tag was pushed
          # to before the retarget.
          git fetch --tags --force origin
          python3 scripts/release_notes.py \
            --tag "$TAG" --to "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
          fi
