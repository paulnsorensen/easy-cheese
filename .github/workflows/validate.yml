name: validate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # validate_skills.py imports easy_cheese.shared.paths, which needs fromargs.
      - name: Install PyYAML and runtime deps
        run: |
          pip install --no-cache-dir pyyaml==6.0.2
          pip install --disable-pip-version-check --no-cache-dir --require-hashes --requirement requirements/runtime.txt

      - name: Test SKILL.md validator
        run: python3 .github/scripts/test_validate_skills.py -v

      - name: Validate SKILL.md frontmatter
        run: python3 .github/scripts/validate_skills.py

  validate-frontmatter:
    name: validate frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # validate_skills.py imports easy_cheese.shared.paths, which needs fromargs.
      - name: Install PyYAML and runtime deps
        run: |
          pip install --no-cache-dir pyyaml==6.0.2
          pip install --disable-pip-version-check --no-cache-dir --require-hashes --requirement requirements/runtime.txt

      - name: Validate SKILL.md frontmatter
        run: python3 .github/scripts/validate_skills.py --checks frontmatter

  test:
    name: test melt + shared + fan-out scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      # PyPI install: no GitHub API call, so the repo-wide GITHUB_TOKEN
      # budget (1,000 requests/hour) is not spent on every job.
      - name: Set up just
        run: |
          uv tool install rust-just==1.58.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: |
          pip install --no-cache-dir pytest==9.0.3 pytest-xdist==3.8.0 pyyaml==6.0.2
          pip install --disable-pip-version-check --no-cache-dir --require-hashes --requirement requirements/runtime.txt

      - name: Gate the checked-in runtime
        run: python3 scripts/runtime_gates.py

      # Main tracks no archives; build them before any suite executes one.
      - name: Build skill archives
        run: just wedge-build

      # Run the publish dist checks before merge, so a merged change cannot
      # stall every later dist publish.
      - name: Stage shippable tree
        run: python3 scripts/stage_release.py --out "$RUNNER_TEMP/dist"

      - name: Install latest gh CLI
        run: |
          set -euo pipefail
          # The releases/latest redirect makes no API call, so the shared
          # runner rate limit cannot fail this step with HTTP 403.
          url=$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest)
          latest="${url##*/}"
          ver="${latest#v}"
          curl -fsSL --retry 3 "https://github.com/cli/cli/releases/download/${latest}/gh_${ver}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 755 "/tmp/gh_${ver}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Validate staged skills
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Run each staged archive
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          for archive in skills/*/scripts/*.pyz; do
            python3 "$archive" --help > /dev/null
          done

      # This job is the workflow's critical path. The suites are
      # subprocess-heavy, so run them with xdist as `just test` does.
      - name: Run melt script tests
        run: python3 -m pytest tests/python -q -p xdist -n auto

      - name: Run shared script tests
        run: python3 -m pytest tests/shared/python -q -p xdist -n auto

      - name: Run fan-out script tests
        run: python3 -m pytest tests/fanout/python -q -p xdist -n auto

      - name: Run schema conformance tests
        run: python3 -m pytest tests/schemas/python -q -p xdist -n auto

  fanout-bats:
    name: test fan-out bats (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: brew install bats-core

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --no-cache-dir pytest==9.0.3 pyyaml==6.0.2
          pip install --disable-pip-version-check --no-cache-dir --require-hashes --requirement requirements/runtime.txt

      - name: Run fan-out pr_plan_to_branches tests
        run: bats tests/fanout/bash/test_pr_plan_to_branches.bats

  typecheck:
    name: type-check python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      # PyPI install: no GitHub API call, so the repo-wide GITHUB_TOKEN
      # budget (1,000 requests/hour) is not spent on every job.
      - name: Set up just
        run: |
          uv tool install rust-just==1.58.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: basedpyright
        run: just typecheck

  lint:
    name: lint markdown, yaml, python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      # PyPI install: no GitHub API call, so the repo-wide GITHUB_TOKEN
      # budget (1,000 requests/hour) is not spent on every job.
      - name: Set up just
        run: |
          uv tool install rust-just==1.58.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            skills/**/*.md
            .agents/**/*.md
            *.md

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml
          format: github

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --no-cache-dir ruff

      - name: ruff check
        run: ruff check .
      - name: vulture dead-code gate
        run: just lint-py-dead-code

  pr-title:
    name: conventional commits pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
