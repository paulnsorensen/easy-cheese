name: build-pyz

# Verify that per-skill .pyz bundles match their sources. Releases still go
# through release.yml; this PR check prevents source changes from landing without
# their generated bundles.

on:
  pull_request:
    paths:
      - '.github/workflows/build-pyz.yml'
      - 'src/**'
      - 'shared/scripts/**'
      - 'scripts/build_pyz.py'
      - 'scripts/check_bundles.py'
      - 'skills/*/scripts/*.pyz'
      - 'pyproject.toml'
      # Vendored deps are staged into ultracook.pyz, so a vendor bump makes the
      # committed bundles stale.
      - 'requirements-vendor.txt'
      - 'scripts/vendor_deps.py'
  push:
    branches: [main]
    # Keep the check on main too so stale bundles are visible after merges.
    paths:
      - '.github/workflows/build-pyz.yml'
      - 'src/**'
      - 'shared/scripts/**'
      - 'scripts/build_pyz.py'
      - 'scripts/check_bundles.py'
      - 'skills/*/scripts/*.pyz'
      - 'pyproject.toml'
      - 'requirements-vendor.txt'
      - 'scripts/vendor_deps.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: check .pyz bundles are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # vendor/ is generated, not committed, so the bundles cannot be rebuilt
      # without it. Hash-pinned in requirements-vendor.txt, so this is
      # deterministic — but, unlike the old committed tree, not offline.
      - name: Vendor runtime dependencies
        run: python3 scripts/vendor_deps.py

      - name: Build bundles
        run: python3 scripts/build_pyz.py

      # Compares member CRCs, not raw bytes: ZIP_DEFLATED output varies between
      # zlib builds, so a byte diff fails for contributors whose toolchain
      # differs from whoever last committed. See scripts/check_bundles.py.
      - name: Check bundles are current
        run: python3 scripts/check_bundles.py

      - name: Check bundled schema version matches pyproject
        run: |-
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          bundle = Path("skills/ultracook/scripts/ultracook.pyz").resolve()
          # Import from the bundle, not the source tree: run outside the repo root
          # with only the .pyz on sys.path so src/ cannot shadow the vendored copy.
          bundled = subprocess.run(
              [sys.executable, "-c", "import easy_cheese_schemas as m; print(m.__version__)"],
              cwd=bundle.parent,
              env=os.environ | {"PYTHONPATH": str(bundle)},
              capture_output=True,
              text=True,
              check=True,
          ).stdout.strip()
          if bundled != declared:
              print(f"::error::easy_cheese_schemas in ultracook.pyz is {bundled}, but pyproject.toml declares {declared}. Sync __version__ and rebuild the bundles.")
              raise SystemExit(1)
          print(f"bundled easy_cheese_schemas {bundled} matches pyproject.toml.")
          PY
