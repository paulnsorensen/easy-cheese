name: build-pyz

# Verify that per-skill .pyz bundles match their sources. Releases still go
# through release.yml; this PR check prevents source changes from landing without
# their generated bundles.

on:
  pull_request:
    paths:
      - '.github/workflows/build-pyz.yml'
      - 'src/**'
      - 'scripts/build_pyz.py'
      - 'scripts/check_bundles.py'
      - 'skills/*/scripts/*.pyz'
      - 'pyproject.toml'
      - 'requirements-build.txt'
      - 'requirements/**/*.txt'
  push:
    branches: [main]
    # Keep the check on main too so stale bundles are visible after merges.
    paths:
      - '.github/workflows/build-pyz.yml'
      - 'src/**'
      - 'scripts/build_pyz.py'
      - 'scripts/check_bundles.py'
      - 'skills/*/scripts/*.pyz'
      - 'pyproject.toml'
      - 'requirements-build.txt'
      - 'requirements/**/*.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: check .pyz bundles are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned build tooling
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --requirement requirements-build.txt

      - name: Install bundle-test dependencies
        run: |
          python3 -m pip install --no-cache-dir pytest==9.0.3 pyyaml==6.0.2
          python3 -m pip install --no-cache-dir --require-hashes --requirement requirements/runtime.txt

      - name: Build bundles
        run: python3 scripts/build_pyz.py

      # Compares canonical member content, not raw bytes: Shiv's ZIP metadata and
      # interpreter paths can vary between toolchains. See scripts/check_bundles.py.
      - name: Check bundles are current
        run: python3 scripts/check_bundles.py

      - name: Test bundle build and isolation contracts
        run: python3 -m pytest tests/python/test_pyz_bundle.py tests/python/test_build_pyz_tree_staging.py -q

      - name: Check bundled schema version matches pyproject
        run: |-
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          import zipfile
          from pathlib import Path

          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          bundle = Path("skills/ultracook/scripts/ultracook.pyz").resolve()
          # Shiv stores package wheels under site-packages/ rather than at the
          # zipapp import root. Read the bundled source member directly, never src/.
          with zipfile.ZipFile(bundle) as archive:
              source = archive.read("site-packages/easy_cheese_schemas/__init__.py").decode()
          match = re.search(r"^__version__ = [\\\"]([^\\\"]+)[\\\"]$", source, re.MULTILINE)
          if match is None:
              raise SystemExit("easy_cheese_schemas.__version__ is missing from ultracook.pyz")
          bundled = match.group(1)
          if bundled != declared:
              print(f"::error::easy_cheese_schemas in ultracook.pyz is {bundled}, but pyproject.toml declares {declared}. Sync __version__ and rebuild the bundles.")
              raise SystemExit(1)
          print(f"bundled easy_cheese_schemas {bundled} matches pyproject.toml.")
          PY
