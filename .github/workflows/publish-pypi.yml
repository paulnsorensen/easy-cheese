name: publish-pypi

# Publish easy-cheese-schemas and easy-cheese-review to PyPI when a version in
# their pyproject.toml changes on main. release.yml cannot carry this: it
# force-retargets the version tag onto an orphan `release` branch holding only
# SKILL.md + wedge launcher + lock + metadata, so no package source is
# reachable from the published tag. This fires on every touch of either
# pyproject.toml, and each job no-ops unless its declared version is new to
# PyPI. The review job waits for the schemas job, because the review package
# can require a schemas version that only that job uploads.
#
# MANUAL PREREQUISITE (not automatable): before the first publish of each
# project succeeds, the repo owner must create a PyPI *pending publisher* that
# names the project (easy-cheese-schemas or easy-cheese-review), this
# repository, and this workflow's filename. The pending publisher is keyed on
# the FILENAME -- renaming this file breaks publishing until the publisher
# entries on PyPI are updated to match.

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'packages/easy-cheese-review/pyproject.toml'
  # Manual recovery when a publish fails after the version already landed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish easy-cheese-schemas to pypi
    # Never publish from a fork: a fork's pyproject.toml is unreviewed here, and
    # its OIDC claims do not match the pending publisher anyway. The ref guard
    # matters just as much -- workflow_dispatch lets anyone with write access
    # pick a branch, and without it a manual run would publish source that never
    # passed through main or review.
    if: >-
      github.repository == 'paulnsorensen/easy-cheese'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (OIDC). No PyPI token or password exists in this repo.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.11 is the declared floor; the last version listed is the default.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12

      - name: Resolve version and check PyPI
        id: version
        env:
          PYPROJECT: pyproject.toml
          PROJECT: easy-cheese-schemas
        run: python3 scripts/pypi_release_check.py

      # The conformance suite is the mandatory mitigation for shipping types
      # derived from the still-live src/fanout validators. validate.yml runs on
      # the same push but nothing makes this job wait for it, so a version bump
      # merged next to a red suite would publish anyway.
      # This job builds no skill archives, so it deselects the one test that
      # runs mold.pyz. validate.yml builds the archives and runs that test.
      - name: Run schema conformance suite
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          pip install --no-cache-dir pytest==9.0.3 pyyaml==6.0.2
          pip install --no-cache-dir --require-hashes --requirement requirements/runtime.txt
          python3 -m pytest tests/schemas/python -q \
            --deselect tests/schemas/python/test_writer_diagnostics.py::test_mold_archive_reports_planner_reason_error

      - name: Build sdist and wheel
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          pip install --no-cache-dir build==1.5.0
          python3 -m build

      - name: Verify the sdist ships only the package
        if: steps.version.outputs.should_publish == 'true'
        env:
          ALLOWED: src/easy_cheese_schemas/ docs/easy-cheese-schemas.md
        run: python3 scripts/sdist_contents_check.py

      # The suites run on 3.12, so only this step proves the 3.11 floor. This
      # job holds id-token: write, so the venv takes only hash-locked
      # dependencies and the wheel built here; pip check proves they satisfy it.
      - name: Import the wheel on Python 3.11
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          python3.11 -m venv "$RUNNER_TEMP/py311"
          "$RUNNER_TEMP/py311/bin/pip" install --no-cache-dir --require-hashes --requirement requirements/runtime.txt
          "$RUNNER_TEMP/py311/bin/pip" install --no-cache-dir --no-deps dist/*.whl
          "$RUNNER_TEMP/py311/bin/pip" check
          cd "$RUNNER_TEMP"
          py311/bin/python -I -c 'import easy_cheese_schemas'

      - name: Publish to PyPI
        if: steps.version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-review:
    name: publish easy-cheese-review to pypi
    needs: publish
    if: >-
      github.repository == 'paulnsorensen/easy-cheese'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12

      - name: Resolve version and check PyPI
        id: version
        env:
          PYPROJECT: packages/easy-cheese-review/pyproject.toml
          PROJECT: easy-cheese-review
        run: python3 scripts/pypi_release_check.py

      # validate.yml runs the same suite, but nothing makes this job wait for it.
      - name: Run easy-cheese-review suite
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          pip install --no-cache-dir pytest==9.0.3 pyyaml==6.0.2
          pip install --no-cache-dir --require-hashes --requirement requirements/runtime.txt
          pip install --no-cache-dir --only-binary=:all: --require-hashes --requirement requirements/ast-grep.txt
          python3 -m pytest tests/review/python -q

      # The schemas wheel comes from this checkout's schemas source, so the 3.11
      # check needs no PyPI lookup. It matches PyPI only when the publish job
      # uploaded in this run.
      - name: Build sdist and wheel
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          pip install --no-cache-dir build==1.5.0
          python3 -m build packages/easy-cheese-review --outdir dist
          python3 -m build --wheel --outdir "$RUNNER_TEMP/schemas-dist"

      - name: Verify the sdist ships only the package
        if: steps.version.outputs.should_publish == 'true'
        env:
          ALLOWED: src/easy_cheese_review/ README.md
        run: python3 scripts/sdist_contents_check.py

      # This job holds id-token: write, so the venv takes only hash-locked
      # dependencies and wheels built here; pip check proves they satisfy the
      # review package's declared requirements.
      - name: Import the wheel on Python 3.11
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          python3.11 -m venv "$RUNNER_TEMP/py311"
          "$RUNNER_TEMP/py311/bin/pip" install --no-cache-dir --require-hashes --requirement requirements/runtime.txt
          "$RUNNER_TEMP/py311/bin/pip" install --no-cache-dir --no-deps dist/*.whl "$RUNNER_TEMP"/schemas-dist/*.whl
          "$RUNNER_TEMP/py311/bin/pip" check
          cd "$RUNNER_TEMP"
          py311/bin/python -I -c 'import easy_cheese_review, easy_cheese_review.severity'

      - name: Publish to PyPI
        if: steps.version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
