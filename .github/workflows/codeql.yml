# CodeQL — GitHub's semantic code analysis for finding security
# vulnerabilities and code quality issues. Runs on PRs, pushes to main,
# and weekly to catch newly disclosed query updates.
# See: https://github.com/github/codeql-action
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "32 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Fork PRs can't get security-events: write (GitHub restricts the
    # GITHUB_TOKEN), so the upload step would 403. Skip the whole job on
    # fork PRs; push/schedule runs still cover the same code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Vendored third-party wheel trees (attrs, cattrs, typing_extensions)
          # are committed so the .pyz bundles build hermetically. They are not
          # our code to fix, and security-and-quality flags their
          # version-guarded exports as undefined. Analysing them would bury real
          # findings under third-party noise.
          config: |
            paths-ignore:
              - vendor

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
