# Defaults for every skill beside this file (see each skill's wedge.toml,
# which names only the skill and its entry point). All paths are relative
# to the skill directory.
#
# The whole runtime package: each archive carries every skill's package
# beside shared and cli, and dispatches only its own commands.
source = "../../src/easy_cheese"
include = ["../../src/easy_cheese_schemas"]
# The repository project: its uv.lock pins the runtime closure, and the
# `runtime` group carries the CLI dependencies the published wheel does not.
project = "../.."
groups = ["runtime"]
repo = "paulnsorensen/easy-cheese"
