[project]
name = "skill-distill"
version = "0.1.0"
description = "Versioned evidence contracts for semantic skill distillation"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
skill-distill = "skill_distill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_distill"]

[tool.pytest.ini_options]
testpaths = ["../../tests/skill-distill/python"]
